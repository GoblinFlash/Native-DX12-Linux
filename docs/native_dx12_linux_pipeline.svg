<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="928" viewBox="0 0 1400 1160" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Native DX12 Linux — experimental NVIDIA compute pipeline</title>
  <desc id="diagram-desc">Two coordinated paths. On the left, DXIL or optional SPIR-V feeds shader IR translation, Mesa NIR, NAK and NVIDIA machine code. On the right, an experimental D3D12 frontend feeds state and resource tracking, NVIDIA RM/UVM memory management, and native pushbuffer submission. Machine code is bound at submission. A dark navy GPU banner has a centered white GPU label. The illustrated runtime submission path is NVIDIA-specific. SPIR-V does not imply a Vulkan runtime.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9.1" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.3 L9.2 5.5 L1 9.7" fill="none" stroke="#097dba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9.1" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.3 L9.2 5.5 L1 9.7" fill="none" stroke="#db650c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panelTitle { font-size: 27px; font-weight: 750; letter-spacing: .055em; }
      .mainLabel { font-size: 24px; font-weight: 730; }
      .subLabel { font-size: 18px; font-weight: 500; }
      .smallLabel { font-size: 16px; font-weight: 600; }
      .blueBox { fill: #eaf5fc; stroke: #63a9d2; stroke-width: 2.2; }
      .orangeBox { fill: #fff1e7; stroke: #efaa77; stroke-width: 2.2; }
      .bluePath { fill: none; stroke: #097dba; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
      .orangePath { fill: none; stroke: #db650c; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1400" height="1160" fill="#f6f8fb"/>
  <rect x="0" y="0" width="700" height="10" fill="#097dba"/>
  <rect x="700" y="0" width="700" height="10" fill="#eb6b0a"/>

  <!-- Identity and scope -->
  <g class="sans">
    <text x="66" y="67" fill="#097dba" font-size="19" font-weight="760" letter-spacing="2.5">NATIVE DX12 LINUX</text>
    <text x="66" y="135" fill="#102449" font-size="32" font-weight="680" letter-spacing="-.4">Experimental Direct3D 12 compute path on Linux — no Vulkan runtime</text>
  </g>

  <!-- Main two-lane panels -->
  <rect x="66" y="223" width="628" height="660" rx="24" fill="#dce6ee" opacity=".43"/>
  <rect x="718" y="223" width="628" height="660" rx="24" fill="#f2dfd1" opacity=".43"/>
  <rect x="60" y="215" width="628" height="660" rx="24" fill="#fff" stroke="#dce7f0" stroke-width="1.8"/>
  <rect x="712" y="215" width="628" height="660" rx="24" fill="#fff" stroke="#f2e1d4" stroke-width="1.8"/>
  <rect x="60" y="215" width="628" height="7" rx="3" fill="#097dba"/>
  <rect x="712" y="215" width="628" height="7" rx="3" fill="#eb6b0a"/>

  <g class="sans">
    <rect x="88" y="250" width="41" height="41" rx="12" fill="#dff0fb"/>
    <text x="108.5" y="278" text-anchor="middle" font-size="21" fill="#097dba" font-weight="800">01</text>
    <text class="panelTitle" x="147" y="279" fill="#11658e">SHADER PREPARATION</text>

    <rect x="740" y="250" width="41" height="41" rx="12" fill="#fff0e0"/>
    <text x="760.5" y="278" text-anchor="middle" font-size="21" fill="#db650c" font-weight="800">02</text>
    <text class="panelTitle" x="799" y="279" fill="#aa4d08">NATIVE LINUX RUNTIME</text>
  </g>

  <!-- Shader sources -->
  <rect x="108" y="320" width="230" height="78" rx="16" class="blueBox"/>
  <rect x="410" y="320" width="230" height="78" rx="16" fill="#fff7ef" stroke="#eab188" stroke-width="2.2" stroke-dasharray="8 6"/>
  <g class="sans" text-anchor="middle" fill="#234762">
    <text x="223" y="354" class="mainLabel">DXIL</text>
    <text x="223" y="379" class="subLabel">DirectX shader</text>
    <text x="525" y="354" class="mainLabel">SPIR-V</text>
    <text x="525" y="379" class="subLabel">Optional intermediate</text>
  </g>
  <path d="M223 398 V421 H374" class="bluePath"/>
  <path d="M525 398 V421 H374" class="bluePath" stroke-dasharray="7 7"/>
  <circle cx="374" cy="421" r="5" fill="#097dba"/>
  <path d="M374 421 V448" class="bluePath" marker-end="url(#arrow-blue)"/>

  <!-- Compiler stages -->
  <rect x="205" y="458" width="338" height="74" rx="17" class="blueBox"/>
  <rect x="205" y="555" width="338" height="74" rx="17" class="blueBox"/>
  <rect x="205" y="652" width="338" height="74" rx="17" class="blueBox"/>
  <rect x="205" y="754" width="338" height="76" rx="17" fill="#d9effc" stroke="#097dba" stroke-width="2.5"/>
  <g class="sans" text-anchor="middle" fill="#1f496b">
    <text x="374" y="489" class="mainLabel">Shader IR translation</text>
    <text x="374" y="512" class="subLabel">Input normalization</text>
    <text x="374" y="586" class="mainLabel">NIR</text>
    <text x="374" y="609" class="subLabel">Mesa shader IR</text>
    <text x="374" y="683" class="mainLabel">NAK</text>
    <text x="374" y="706" class="subLabel">NVIDIA code generation</text>
    <text x="374" y="784" class="mainLabel">NVIDIA machine code</text>
    <text x="374" y="808" class="subLabel">SASS</text>
  </g>
  <path d="M374 532 V547" class="bluePath" marker-end="url(#arrow-blue)"/>
  <path d="M374 629 V644" class="bluePath" marker-end="url(#arrow-blue)"/>
  <path d="M374 726 V746" class="bluePath" marker-end="url(#arrow-blue)"/>

  <!-- Runtime stages -->
  <rect x="854" y="320" width="346" height="78" rx="17" class="orangeBox"/>
  <rect x="854" y="454" width="346" height="78" rx="17" class="orangeBox"/>
  <rect x="854" y="588" width="346" height="88" rx="17" class="orangeBox"/>
  <rect x="854" y="754" width="346" height="76" rx="17" fill="#ffe4d0" stroke="#eb6b0a" stroke-width="2.5"/>
  <g class="sans" text-anchor="middle" fill="#853a07">
    <text x="1027" y="350" class="mainLabel">Experimental D3D12</text>
    <text x="1027" y="377" class="subLabel">frontend</text>
    <text x="1027" y="485" class="mainLabel">State &amp; resource</text>
    <text x="1027" y="512" class="subLabel">tracking</text>
    <text x="1027" y="621" class="mainLabel">NVIDIA RM / UVM</text>
    <text x="1027" y="647" class="subLabel">GPU memory &amp; virtual addresses</text>
    <text x="1027" y="784" class="mainLabel">Native pushbuffer</text>
    <text x="1027" y="808" class="subLabel">GPU command submission</text>
  </g>
  <path d="M1027 398 V446" class="orangePath" marker-end="url(#arrow-orange)"/>
  <path d="M1027 532 V580" class="orangePath" marker-end="url(#arrow-orange)"/>
  <path d="M1027 676 V745" class="orangePath" marker-end="url(#arrow-orange)"/>

  <!-- Link compiled native machine code to submission -->
  <path d="M543 793 H843" class="bluePath" marker-end="url(#arrow-blue)"/>
  <rect x="621" y="764" width="158" height="23" rx="9" fill="#fff"/>
  <text x="700" y="781" text-anchor="middle" class="sans smallLabel" fill="#11658e">Native code binding</text>

  <!-- GPU banner. The illustrated submission arrow applies to NVIDIA only. -->
  <path d="M1027 830 V916 H489 V933" class="orangePath" marker-end="url(#arrow-orange)"/>
  <rect x="390" y="950" width="632" height="94" rx="23" fill="#d7e4ed" opacity=".65"/>
  <rect x="384" y="942" width="632" height="94" rx="23" fill="#102449" stroke="#263e58" stroke-width="2.6"/>
  <text x="700" y="1001" class="sans" text-anchor="middle" font-size="37" font-weight="780" fill="#fff">GPU</text>

  <!-- Explicit capability notes -->
  <g class="sans" font-size="18" fill="#596d7e">
    <text x="65" y="1106">SPIR-V is an optional compiler intermediate, not a Vulkan runtime dependency.</text>
    <text x="65" y="1138">Scope: experimental NVIDIA compute path; not complete D3D12, DXGI or game compatibility.</text>
    <text x="1335" y="1138" text-anchor="end" font-size="16" font-weight="720" fill="#627c8b">Andrew Kapica — GoblinFlash</text>
  </g>
</svg>
