 <text x="754" y="502" class="value">7.90 µs</text>
 <text x="182" y="528" class="axis">0</text>
 <text x="732" y="528" text-anchor="end" class="axis">Local scale · max 17.90 µs</text>
<rect x="32" y="562" width="936" height="160" rx="14" fill="#ffffff" stroke="#dce5e9"/>
