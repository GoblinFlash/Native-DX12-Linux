<text x="34" y="947" class="foot">* Native ticks are shown as approximate µs using a conditional ~1 ns/tick model.</text>
<text x="34" y="972" class="foot">Vulkan values are measured ns displayed in µs. Every panel resets its horizontal scale.</text>
<text x="34" y="997" class="foot">No cross-GPU ranking, ratio or speedup is inferred from these median values.</text>
<text x="34" y="1022" class="axis">Source: submitted public share-results archive · NVIDIA Open 620.70.06 · 189/189 exported VERIFIED statuses</text>
</svg>
