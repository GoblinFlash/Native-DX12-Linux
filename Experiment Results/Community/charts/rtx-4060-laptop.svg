<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
<title id="title">RTX 4060 Laptop v0.1.4 selected community benchmark medians</title>
<desc id="desc">Four independent panels show approximate Native GPU tick-derived microseconds and reported Vulkan reference microseconds for Affine, D4, K and WaveForm. Per-panel scale changes. Clock model qualified conditionally, no speedup claim.</desc>
<style>
text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#182b3b}
.head{font-size:38px;font-weight:750;letter-spacing:-1px}
.sub{font-size:20px;fill:#526477}
.status{font-size:18px;font-weight:650;fill:#08775c}
.workload{font-size:25px;font-weight:700}
.label{font-size:20px;fill:#405369;font-weight:600}
.value{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.axis{font-size:14px;fill:#718193}
.foot{font-size:17px;fill:#405369}
</style>
<rect width="1000" height="1040" fill="#f4f7fa"/>
<text x="34" y="65" class="head">RTX 4060 Laptop</text>
<text x="34" y="100" class="sub">Community benchmark v0.1.4 · selected workload medians · Issue #2</text>
<rect x="34" y="123" width="270" height="36" rx="18" fill="#dbf3e9"/>
<text x="49" y="148" class="status">CLOCK: QUALIFIED (4/4)</text>
<circle cx="658" cy="144" r="7" fill="#147d63"/><text x="672" y="151" class="sub">Native*</text>
<circle cx="794" cy="144" r="7" fill="#4f709d"/><text x="809" y="151" class="sub">Vulkan reference</text>
<text x="34" y="185" class="sub">Laptop configuration · independent GPU rerun not performed</text>
<rect x="32" y="204" width="936" height="160" rx="14" fill="#ffffff" stroke="#dce5e9"/>
