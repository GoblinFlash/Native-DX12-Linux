<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-label="RTX 5070 FWHT raw GPU timer ticks: SYSMEM data 856480, VRAM data 32096, and VRAM data plus VRAM code 32064 with a refused VM audit.">
<rect width="980" height="540" fill="#ffffff"/>
<rect x="26" y="24" width="928" height="492" rx="8" fill="#ffffff" stroke="#d7e2ea"/>
<text x="54" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#142b45">FWHT / RTX 5070 — memory placement</text>
<text x="54" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#3c5874">128 × 128 u32 · 2 dispatches per frame · medians from 12 frames per profile</text>
<text x="54" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#3c5874">Raw GPU timer ticks (lower is better; not calibrated to time)</text>
<g font-family="DejaVu Sans, Arial, sans-serif">
<line x1="275" y1="145" x2="275" y2="421" stroke="#d4dfe9" stroke-width="1"/><text x="275" y="445" font-size="13" fill="#3c5874" text-anchor="middle">0</text>
<line x1="390.55555555555554" y1="145" x2="390.55555555555554" y2="421" stroke="#d4dfe9" stroke-width="1"/><text x="390.55555555555554" y="445" font-size="13" fill="#3c5874" text-anchor="middle">200k</text>
<line x1="506.1111111111111" y1="145" x2="506.1111111111111" y2="421" stroke="#d4dfe9" stroke-width="1"/><text x="506.1111111111111" y="445" font-size="13" fill="#3c5874" text-anchor="middle">400k</text>
<line x1="621.6666666666666" y1="145" x2="621.6666666666666" y2="421" stroke="#d4dfe9" stroke-width="1"/><text x="621.6666666666666" y="445" font-size="13" fill="#3c5874" text-anchor="middle">600k</text>
<line x1="737.2222222222222" y1="145" x2="737.2222222222222" y2="421" stroke="#d4dfe9" stroke-width="1"/><text x="737.2222222222222" y="445" font-size="13" fill="#3c5874" text-anchor="middle">800k</text>
<text x="255" y="202" font-size="16" fill="#142b45" text-anchor="end">SYSMEM data</text><rect x="275" y="177" width="494.855" height="36" rx="3" fill="#087fba"/><text x="779.86" y="202" font-size="16" font-weight="600" fill="#142b45">856,480</text>
<text x="255" y="297" font-size="16" fill="#142b45" text-anchor="end">VRAM data</text><rect x="275" y="272" width="18.544" height="36" rx="3" fill="#f2770d"/><text x="303.54" y="297" font-size="16" font-weight="600" fill="#142b45">32,096</text>
<text x="255" y="392" font-size="16" fill="#142b45" text-anchor="end">VRAM data + code*</text><rect x="275" y="367" width="18.526" height="36" rx="3" fill="#f6a15a" stroke="#c7600c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="303.53" y="392" font-size="16" font-weight="600" fill="#142b45">32,064</text>
<text x="275" y="469" font-size="14" fill="#142b45">One GPU process per placement · unlocked clocks · no general performance claim.</text>
<text x="275" y="494" font-size="13" fill="#3c5874">* VM code audit refused; saved bytes passed a corrected CPU-side recheck.</text>
</g>
</svg>
