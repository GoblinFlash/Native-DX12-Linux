# Categories only. Never fetch user attachments, execute user text, or commit results.
name: Categorize GPU benchmark submissions

on:
  issues:
    types: [opened, edited, reopened]

# Runs for the same Issue cannot mutate its labels at the same time.
# GitHub does not guarantee event ordering: fetch the CURRENT Issue during each run.
concurrency:
  group: benchmark-gpu-categories-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  actions: write # Required only to dispatch an intake retry after label reconciliation.

jobs:
  gpu-category:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile managed GPU category labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node.js 24
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // Use GitHub's latest state, never the potentially stale event snapshot.
            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number
            });
            const lines = (issue.body || '').split(/\r?\n/);
            const current = new Set((issue.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            ));

            function readField(name) {
              const header = '### ' + name;
              const index = lines.findIndex(line => line.trim() === header);
              if (index === -1) return null;
              for (let i = index + 1; i < lines.length; i++) {
                const value = lines[i].trim();
                if (value.startsWith('### ')) break;
                if (value && value !== '_No response_') return value;
              }
              return null;
            }

            // Keep closely related GPU models separate (Laptop, Ti, Super, D).
            // Fixed GPU categories mirror community_intake.GPU_NAMES.
            // GeForce without RTX is accepted only for an exact allowlisted GPU.
            const supportedNvidia = [
              "RTX 4090", "RTX 4090 Laptop GPU", "RTX 4090 D",
              "RTX 4080", "RTX 4080 Super", "RTX 4080 Laptop GPU",
              "RTX 4070", "RTX 4070 Ti", "RTX 4070 Super",
              "RTX 4070 Ti Super", "RTX 4070 Laptop GPU", "RTX 4060",
              "RTX 4060 Ti", "RTX 4060 Laptop GPU", "RTX 4050 Laptop GPU",
              "RTX 3090", "RTX 3090 Ti", "RTX 3080",
              "RTX 3080 Ti", "RTX 3080 Laptop GPU", "RTX 3080 Ti Laptop GPU",
              "RTX 3070", "RTX 3070 Ti", "RTX 3070 Laptop GPU",
              "RTX 3070 Ti Laptop GPU", "RTX 3060", "RTX 3060 Ti",
              "RTX 3060 Laptop GPU", "RTX 3050", "RTX 3050 Laptop GPU",
              "RTX 3050 Ti Laptop GPU", "RTX 3050 A Laptop GPU", "RTX 5090",
              "RTX 5090 D", "RTX 5090 Laptop GPU", "RTX 5080",
              "RTX 5080 Laptop GPU", "RTX 5070", "RTX 5070 Ti",
              "RTX 5070 Laptop GPU", "RTX 5070 Ti Laptop GPU", "RTX 5060",
              "RTX 5060 Ti", "RTX 5060 Laptop GPU"
            ];
            const known = supportedNvidia.map(name => {
              const lower = name.toLowerCase();
              const model = lower.endsWith(' laptop gpu')
                ? lower.slice(0, -4) + '(?: gpu)?' : lower;
              const shortName = name.slice(4).toLowerCase();
              const shortModel = shortName.endsWith(' laptop gpu')
                ? shortName.slice(0, -4) + '(?: gpu)?' : shortName;
              const slug = lower.replace(/ laptop gpu$/, ' laptop').replace(/\s+/g, '-');
              return ['gpu:' + slug, new RegExp('^(?:(?:nvidia )?(?:geforce )?' +
                model + '|(?:nvidia )?geforce ' + shortModel + ')$')];
            });
            known.push(
              ['gpu:amd-rx-7900-xtx', /^(?:amd )?(?:radeon )?rx 7900 xtx$/],
              ['gpu:intel-arc-a770', /^(?:intel )?arc a770$/]
            );

            // Strict ownership: never remove unrelated/manual gpu:* labels.
            const managed = new Set([
              'benchmark:submission', 'gpu:unclassified',
              ...known.map(([label]) => label)
            ]);

            const desired = new Set();
            const eligible = issue.title.startsWith('[Results]') &&
              readField('GPU model') && readField('Benchmark version');

            if (eligible) {
              const model = readField('GPU model')
                .toLowerCase().replace(/[\s\u00a0]+/g, ' ')
                .replace(/ \(pci [0-9a-f]{4}:[0-9a-f]{4}\)$/, '').trim();
              const match = known.find(([, regex]) => regex.test(model));
              desired.add('benchmark:submission');
              desired.add(match ? match[0] : 'gpu:unclassified');
            }

            for (const name of desired) {
              // Auto-create only the fixed allowlisted labels.
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name,
                    color: name === 'gpu:unclassified' ? 'd4c5f9' : '1d76db',
                    description: name === 'benchmark:submission'
                      ? 'Community submission, not automatically verified'
                      : 'GPU model category; not a validated benchmark'
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  // Only tolerate an existing label after a concurrent create.
                  await github.rest.issues.getLabel({ owner, repo, name });
                }
              }
            }

            const missing = [...desired].filter(name => !current.has(name));
            if (missing.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: missing
              });
            }

            const stale = [...current].filter(name =>
              managed.has(name) && !desired.has(name)
            );
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name
                });
              } catch (error) {
                // Another actor may have removed this label since the GET.
                if (error.status !== 404) throw error;
              }
            }

            // Labels created with GITHUB_TOKEN do not fire downstream workflows.
            // On a failed dispatch, labels persist; a rerun must retry even if
            // no label is missing. Avoid dispatch on every normal Issue edit.
            // Non-manual mode preserves the approval gate.
            if (desired.has('benchmark:submission') &&
                (missing.includes('benchmark:submission') ||
                 Number(process.env.GITHUB_RUN_ATTEMPT || '1') > 1)) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'community-benchmark-intake.yml',
                ref: 'main',
                inputs: {
                  issue_number: String(issue_number),
                  intake_mode: 'label-reconciled'
                }
              });
            }

            core.info('Issue #' + issue_number + ': ' +
              (eligible ? [...desired].join(', ') : 'no active benchmark category') +
              '; no correctness or performance verification performed.');
