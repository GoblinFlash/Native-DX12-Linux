name: Benchmark results / Test submission
description: Share a benchmark run from your GPU, including completed, partial or failed runs.
title: "[Results] "
labels: ["benchmark:submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Give the exact GPU model, driver and benchmark version, then attach your results below.

        New submissions are public GitHub Issues. Supported GPU models receive a category label automatically; unknown models stay unclassified until reviewed. Labels do **not** mean that a result is verified.

        When enabled, intake automation can read selected numeric fields from a supported bundle and propose an UNVERIFIED draft PR in a separate exact-GPU/release folder. An outside contributor first needs maintainer intake authorization. Unknown models, unsupported files and conflicting identities require manual review. Only a maintainer review and explicit owner approval can accept results; intake never merges or closes your Issue. Later edits do not silently overwrite an existing draft.

        **This issue and its attachments are public and linked to your GitHub account.**
        Inspect `share-results-<release>.tar.gz` (older releases: `share-results.tar.gz`) before attaching it. Remove anything you do not want public, such as usernames, hostnames, IP addresses, serial numbers or personal paths. Mention any redaction without repeating the removed values.
        Do not upload an unfiltered raw benchmark evidence directory. If you cannot safely share the bundle, describe the result instead.
  - type: dropdown
    id: version
    attributes:
      label: Benchmark version
      description: Select the version shown in your benchmark results. Never guess from the driver or GPU model; select Other/unknown if unsure.
      options:
        - v0.1.5
        - v0.1.4
        - Other or unknown
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model
      description: Copy the exact model from the exported run.json or summary.txt. Include Laptop GPU, Ti, Super or D suffixes; if your title and archive disagree, explain before submitting. No serial numbers or host identifiers.
      placeholder: "NVIDIA GeForce RTX 3090"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: GPU driver version
      description: Exact driver version and stack (e.g. NVIDIA Open or proprietary, AMD Mesa, Intel Mesa) if known. Write unknown if necessary.
      placeholder: "620.70.06, NVIDIA Open kernel module"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Linux distribution and version (optional)
      placeholder: "Ubuntu 26.04.1 or EndeavourOS"
  - type: dropdown
    id: run_status
    attributes:
      label: Run status
      description: Report what happened. A completed run is not automatically a correctness PASS; the attached results will be checked.
      options:
        - Full test completed
        - Selected tests completed
        - Stopped or interrupted before completion
        - Failed or refused to start
        - Unsure
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results attachment or summary
      description: Drag share-results-<release>.tar.gz (older releases use share-results.tar.gz) into this field and wait for the upload to finish. If it is unavailable or cannot be shared safely, describe the result or error instead. Checked charts may also be attached.
      placeholder: "Attach the inspected share-results-<release>.tar.gz (older releases use share-results.tar.gz) here, or describe why no bundle is available."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional details (optional)
      description: Selected tests, whether Vulkan ran, clock qualification, current or locked clocks, background GPU/ONNX activity, bare metal or VM, interruptions, provenance limitations or redactions. A 189/189 count alone is not qualification. No host identifiers or private paths are needed.
