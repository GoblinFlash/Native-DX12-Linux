<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="about mobile">
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="560" height="320" rx="17" fill="#f0f3f5"/><rect x="0" y="0" width="8" height="320" rx="4" fill="#90a2af"/><text x="30" y="48" font-size="19" fill="#283747" font-weight="750" letter-spacing=".4">ABOUT THE PROJECT</text><text x="30" y="92" font-size="19" fill="#374756" font-weight="450">Native DX12 Linux explores direct Direct3D 12</text><text x="30" y="126" font-size="19" fill="#374756" font-weight="450">execution on Linux without Vulkan or VKD3D</text><text x="30" y="160" font-size="19" fill="#374756" font-weight="450">translation.</text><text x="30" y="194" font-size="19" fill="#374756" font-weight="450">Native NVIDIA RTX compute work has been</text><text x="30" y="228" font-size="19" fill="#374756" font-weight="450">demonstrated. Full D3D12 applications and</text><text x="30" y="262" font-size="19" fill="#374756" font-weight="450">games are not supported yet.</text></g></svg>