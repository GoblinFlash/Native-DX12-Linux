<svg xmlns="http://www.w3.org/2000/svg" width="950" height="205" viewBox="0 0 950 205" role="img" aria-label="about desktop">
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="950" height="205" rx="17" fill="#f0f3f5"/><rect x="0" y="0" width="8" height="205" rx="4" fill="#90a2af"/><text x="34" y="48" font-size="21" fill="#283747" font-weight="750" letter-spacing=".4">ABOUT THE PROJECT</text><text x="34" y="83" font-size="21" fill="#374756" font-weight="450">Native DX12 Linux explores direct Direct3D 12 execution on Linux</text><text x="34" y="115" font-size="21" fill="#374756" font-weight="450">without Vulkan or VKD3D translation.</text><text x="34" y="147" font-size="21" fill="#374756" font-weight="450">Native NVIDIA RTX compute execution has been demonstrated on hardware.</text><text x="34" y="179" font-size="21" fill="#374756" font-weight="450">Full D3D12 applications and games are not supported yet.</text></g></svg>