<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-label="goal mobile">
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="560" height="180" rx="16" fill="#e9edf0"/><rect x="0" y="0" width="7" height="180" rx="3" fill="#9caab3"/><text x="28" y="40" font-size="19" fill="#40515d" font-weight="450">The goal is to reduce unnecessary work,</text><text x="28" y="76" font-size="19" fill="#40515d" font-weight="450">improve GPU execution efficiency and</text><text x="28" y="112" font-size="19" fill="#40515d" font-weight="450">achieve better performance without</text><text x="28" y="148" font-size="19" fill="#40515d" font-weight="450">sacrificing correctness.</text></g></svg>